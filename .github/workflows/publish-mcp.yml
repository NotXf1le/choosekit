name: Publish MCP to npm

on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/choosekit-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Verify release tag
        run: |
          node --input-type=module -e "import p from './package.json' with { type: 'json' }; if (process.env.GITHUB_REF_NAME !== 'mcp-v' + p.version) { throw new Error('Tag must match package version'); }"
      - run: npm publish --access public
